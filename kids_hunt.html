<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Kids QR Hunt</title>

<link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
<link href="https://unpkg.com/nes.css/css/nes.css" rel="stylesheet">

<style>
  body {
    margin: 0;
    font-family: "Press Start 2P";
    background: #212529;
    color: #fff;
    overflow: hidden;
  }

  header {
    background: #ffcc00;
    color: #000;
    text-align: center;
    padding: 14px;
  }

  main {
    display: flex;
    height: calc(100vh - 72px);
  }

  .left, .right {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-box {
    text-align: center;
    padding: 24px;
  }

  .icon {
    font-size: 96px;
    margin-bottom: 24px;
  }

  #reader {
    width: 320px;
    display: none;
  }

  .done {
    font-size: 48px;
    text-align: center;
  }

  .scan-btn {
    margin-bottom: 12px;
  }
</style>
</head>

<body>

<header>
  <h3>FIND THIS!</h3>
</header>

<main>
  <!-- LEFT: ICON -->
  <div class="left">
    <div class="nes-container is-rounded icon-box">
      <div id="icon" class="icon">🍌</div>
      <p id="label">BANANA</p>
    </div>
  </div>

  <!-- RIGHT: SCANNER -->
  <div class="right">
    <div>
      <button class="nes-btn is-primary scan-btn" onclick="startScan()">SCAN</button>
      <div id="reader"></div>
    </div>
  </div>
</main>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
/* =========================
   OBJECTS KIDS CAN FIND
========================= */
const objects = [
  { id: "banana", label: "BANANA", icon: "🍌" },
  { id: "apple", label: "APPLE", icon: "🍎" },
  { id: "car", label: "CAR", icon: "🚗" },
  { id: "spaceship", label: "SPACESHIP", icon: "🚀" },
  { id: "dog", label: "DOG", icon: "🐶" },
  { id: "cat", label: "CAT", icon: "🐱" },
  { id: "ball", label: "BALL", icon: "⚽" },
  { id: "star", label: "STAR", icon: "⭐" },
  { id: "tree", label: "TREE", icon: "🌳" },
  { id: "house", label: "HOUSE", icon: "🏠" }
];

/* =========================
   GAME STATE
========================= */
let remaining = objects.sort(() => Math.random() - 0.5);
let current = remaining.shift();

let scanner;
let scanning = false;
let lastScanTime = 0;

/* =========================
   UI UPDATE
========================= */
function showCurrent() {
  if (!current) {
    document.querySelector(".left").innerHTML =
      `<div class="done">🎉 DONE! 🎉</div>`;
    document.querySelector(".right").innerHTML =
      `<div class="done">👏 GREAT JOB!</div>`;
    return;
  }

  document.getElementById("icon").textContent = current.icon;
  document.getElementById("label").textContent = current.label;
}

/* =========================
   START SCANNER (ONCE)
========================= */
function startScan() {
  if (scanning) return;

  const reader = document.getElementById("reader");
  reader.style.display = "block";

  scanner = new Html5Qrcode("reader");
  scanning = true;

  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    onScan
  );
}

/* =========================
   SCAN HANDLER (CONTINUOUS)
========================= */
function onScan(text) {
  const now = Date.now();

  // cooldown to prevent double scans
  if (now - lastScanTime < 1200) return;
  lastScanTime = now;

  const value = text.trim().toLowerCase();

  if (current && value === current.id) {
    // green flash
    document.body.style.background = "#28a745";
    setTimeout(() => document.body.style.background = "#212529", 250);

    current = remaining.shift();
    showCurrent();

    // finished
    if (!current) {
      scanner.stop();
      scanning = false;
      document.getElementById("reader").style.display = "none";
    }
  }
}

/* =========================
   INIT
========================= */
showCurrent();
</script>

</body>
</html>
